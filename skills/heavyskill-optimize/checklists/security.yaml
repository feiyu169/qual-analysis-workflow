domain: security
name: "安全审查清单"
version: "2.0"
description: "针对安全漏洞的专项检查清单"
source: builtin
updated: 2026-06-21

items:
  # ==================== 输入验证 ====================
  - id: "S-01"
    question: "是否存在SQL注入风险？"
    severity: "P0"
    category: "输入验证"
    check_scope: [code, config]
    languages: [python, java, go, js, php, ruby]
    check_points:
      - "是否使用参数化查询？"
      - "是否对用户输入进行验证？"
      - "是否使用ORM？"
      - "是否有SQL语句拼接？"
    fix_suggestion:
      steps:
        - "1. 识别所有 SQL 查询语句"
        - "2. 检查是否使用参数化查询（如 Python: cursor.execute('SELECT * FROM users WHERE id = %s', (id,))）"
        - "3. 检查是否有字符串拼接（如 'SELECT * FROM users WHERE id = ' + id）"
        - "4. 如有拼接，改为参数化查询或使用 ORM"
      example: |
        # Python 示例
        cursor.execute("SELECT * FROM users WHERE id = %s", (user_id,))
        
        # Java 示例
        PreparedStatement stmt = conn.prepareStatement("SELECT * FROM users WHERE id = ?");
        stmt.setInt(1, userId);
    references:
      - "https://owasp.org/www-community/attacks/SQL_Injection"
  
  - id: "S-02"
    question: "是否存在XSS攻击风险？"
    severity: "P1"  # 降级：现代框架默认防护
    category: "输入验证"
    check_scope: [code, config]
    languages: [js, ts, jsx, tsx, vue, html]
    check_points:
      - "是否使用 dangerouslySetInnerHTML/v-html/innerHTML？"
      - "是否对用户输入进行转义？"
      - "是否使用CSP头？"
      - "是否有富文本输入？如何处理？"
    fix_suggestion:
      steps:
        - "1. 检查是否使用 dangerouslySetInnerHTML/v-html/innerHTML"
        - "2. 如有使用，确认输入已通过 DOMPurify 等库消毒"
        - "3. 对于富文本，使用白名单过滤而非黑名单"
        - "4. 配置 CSP 头限制脚本来源"
      example: |
        // React 示例（避免 dangerouslySetInnerHTML）
        // ❌ 危险
        <div dangerouslySetInnerHTML={{__html: userContent}} />
        
        // ✅ 安全
        <div>{userContent}</div>
        
        // 或使用 DOMPurify
        import DOMPurify from 'dompurify';
        <div dangerouslySetInnerHTML={{__html: DOMPurify.sanitize(userContent)}} />
    references:
      - "https://owasp.org/www-community/attacks/xss/"
    upgrade_conditions:
      - "使用 dangerouslySetInnerHTML/v-html/innerHTML → 升级为 P0"
      - "无框架默认防护（如原生 JS）→ 升级为 P0"
  
  - id: "S-03"
    question: "是否有CSRF防护机制？"
    severity: "P1"
    category: "输入验证"
    check_scope: [code, config]
    languages: [python, java, go, js, php, ruby]
    check_points:
      - "是否有CSRF Token？"
      - "是否验证Referer？"
      - "是否使用SameSite Cookie？"
      - "状态变更操作是否使用POST？"
    fix_suggestion:
      steps:
        - "1. 在表单中添加 CSRF Token"
        - "2. 服务端验证 CSRF Token"
        - "3. 设置 Cookie 的 SameSite 属性为 Strict 或 Lax"
        - "4. 状态变更操作使用 POST 方法"
      example: |
        # Django 示例
        <form method="post">
            {% csrf_token %}
            ...
        </form>
        
        # Flask 示例
        from flask_wtf.csrf import CSRFProtect
        csrf = CSRFProtect(app)
    references:
      - "https://owasp.org/www-community/attacks/csrf"
  
  - id: "S-04"
    question: "是否有命令注入风险？"
    severity: "P0"
    category: "输入验证"
    check_scope: [code]
    languages: [python, java, go, js, php, ruby, bash]
    check_points:
      - "是否使用 os.system/subprocess/shell 执行命令？"
      - "是否使用 Runtime.getRuntime().exec()？"
      - "是否使用 exec.Command()？"
      - "是否对命令参数进行转义？"
    fix_suggestion:
      steps:
        - "1. 避免使用 shell=True"
        - "2. 使用参数列表而非字符串拼接"
        - "3. 使用白名单限制命令"
        - "4. 对用户输入进行严格验证"
      example: |
        # Python 示例
        # ❌ 危险
        os.system('ls ' + user_input)
        
        # ✅ 安全
        subprocess.run(['ls', user_input], shell=False)
        
        # Java 示例
        // ❌ 危险
        Runtime.getRuntime().exec("ls " + userInput);
        
        // ✅ 安全
        ProcessBuilder pb = new ProcessBuilder("ls", userInput);
    references:
      - "https://owasp.org/www-community/attacks/Command_Injection"
  
  - id: "S-05"
    question: "是否有路径遍历风险？"
    severity: "P1"
    category: "输入验证"
    check_scope: [code]
    languages: [python, java, go, js, php, ruby]
    check_points:
      - "是否验证文件路径？"
      - "是否限制访问目录？"
      - "是否处理 ../ 等特殊字符？"
    fix_suggestion:
      steps:
        - "1. 使用 os.path.realpath 规范化路径"
        - "2. 验证路径是否在允许的目录内"
        - "3. 禁止访问上级目录"
      example: |
        # Python 示例
        import os
        base_dir = '/var/www/uploads'
        file_path = os.path.realpath(os.path.join(base_dir, user_input))
        
        if not file_path.startswith(base_dir):
            raise ValueError("Invalid path")
    references:
      - "https://owasp.org/www-community/attacks/Path_Traversal"

  # ==================== 认证授权 ====================
  - id: "S-06"
    question: "密码是否加密存储？"
    severity: "P0"
    category: "认证授权"
    check_scope: [code]
    languages: [python, java, go, js, php, ruby]
    check_points:
      - "是否使用 bcrypt/scrypt/argon2？"
      - "是否有加盐？"
      - "是否使用明文存储？"
      - "是否使用 MD5/SHA1？（不安全）"
    fix_suggestion:
      steps:
        - "1. 使用 bcrypt 或 argon2 加密密码"
        - "2. 确保每次加密都使用随机盐"
        - "3. 禁止使用 MD5/SHA1 等弱哈希算法"
        - "4. 禁止明文存储密码"
      example: |
        # Python 示例
        import bcrypt
        password = b"my_password"
        hashed = bcrypt.hashpw(password, bcrypt.gensalt())
        
        # 验证
        if bcrypt.checkpw(password, hashed):
            print("Password matches")
        
        # Node.js 示例
        const bcrypt = require('bcrypt');
        const hashed = await bcrypt.hash(password, 10);
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"
  
  - id: "S-07"
    question: "是否有权限检查？"
    severity: "P1"
    category: "认证授权"
    check_scope: [code, config]
    languages: [python, java, go, js, php, ruby]
    check_points:
      - "每个接口是否检查权限？"
      - "是否有越权访问风险？"
      - "是否有RBAC机制？"
      - "是否检查资源所有权？"
    fix_suggestion:
      steps:
        - "1. 实现统一的权限检查中间件"
        - "2. 使用 RBAC 模型管理权限"
        - "3. 在每个接口添加权限检查装饰器"
        - "4. 检查用户是否有权访问特定资源"
      example: |
        # Python Flask 示例
        from functools import wraps
        
        def require_permission(permission):
            def decorator(f):
                @wraps(f)
                def decorated(*args, **kwargs):
                    if not current_user.has_permission(permission):
                        abort(403)
                    return f(*args, **kwargs)
                return decorated
            return decorator
        
        @app.route('/admin')
        @require_permission('admin')
        def admin_page():
            ...
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
  
  - id: "S-08"
    question: "会话管理是否安全？"
    severity: "P1"
    category: "认证授权"
    check_scope: [code, config]
    languages: [python, java, go, js, php, ruby]
    check_points:
      - "Session ID是否随机生成？"
      - "Session是否设置过期时间？"
      - "是否防止Session固定攻击？"
      - "是否使用HttpOnly Cookie？"
    fix_suggestion:
      steps:
        - "1. 使用安全的随机数生成器生成 Session ID"
        - "2. 设置合理的过期时间（如 30 分钟）"
        - "3. 登录后重新生成 Session ID"
        - "4. 设置 Cookie 的 HttpOnly 和 Secure 属性"
      example: |
        # Flask 示例
        app.config['SESSION_COOKIE_HTTPONLY'] = True
        app.config['SESSION_COOKIE_SECURE'] = True
        app.config['PERMANENT_SESSION_LIFETIME'] = timedelta(minutes=30)
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html"
  
  - id: "S-09"
    question: "JWT实现是否安全？"
    severity: "P1"
    category: "认证授权"
    check_scope: [code, config]
    languages: [python, java, go, js, php, ruby]
    check_points:
      - "是否使用强密钥？"
      - "是否设置过期时间？"
      - "是否验证签名算法？"
      - "是否防止JWT伪造？"
    fix_suggestion:
      steps:
        - "1. 使用 RS256 或 ES256 算法"
        - "2. 设置短过期时间（如 15 分钟）"
        - "3. 实现刷新机制"
        - "4. 验证签名算法，防止算法混淆攻击"
      example: |
        # Python PyJWT 示例
        import jwt
        
        # 生成
        token = jwt.encode(
            {'user_id': user.id, 'exp': datetime.utcnow() + timedelta(minutes=15)},
            private_key,
            algorithm='RS256'
        )
        
        # 验证
        payload = jwt.decode(token, public_key, algorithms=['RS256'])
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html"

  # ==================== 数据保护 ====================
  - id: "S-10"
    question: "是否有密钥硬编码问题？"
    severity: "P0"
    category: "配置安全"
    check_scope: [code, config]
    languages: [python, java, go, js, php, ruby, yaml, json, env]
    check_points:
      - "密钥是否在代码中？"
      - "是否使用环境变量？"
      - "是否使用密钥管理服务？"
      - "是否有 .gitignore 保护？"
    fix_suggestion:
      steps:
        - "1. 将密钥移到环境变量或密钥管理服务"
        - "2. 在 .gitignore 中排除 .env 文件"
        - "3. 使用 python-dotenv 或类似库加载环境变量"
        - "4. 在代码中使用 os.environ.get('SECRET_KEY')"
      example: |
        # Python 示例
        import os
        SECRET_KEY = os.environ.get('SECRET_KEY')
        
        # .env 文件
        SECRET_KEY=your-secret-key-here
        
        # .gitignore
        .env
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
  
  - id: "S-11"
    question: "敏感数据是否加密传输？"
    severity: "P1"
    category: "数据保护"
    check_scope: [config]
    languages: [all]
    check_points:
      - "是否使用HTTPS？"
      - "是否有证书验证？"
      - "是否加密存储敏感数据？"
    fix_suggestion:
      steps:
        - "1. 强制使用 HTTPS"
        - "2. 配置 HSTS 头"
        - "3. 敏感数据加密存储"
        - "4. 使用 TLS 1.2+"
      example: |
        # Nginx 示例
        server {
            listen 443 ssl;
            ssl_certificate /etc/ssl/certs/example.com.crt;
            ssl_certificate_key /etc/ssl/private/example.com.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            
            add_header Strict-Transport-Security "max-age=31536000" always;
        }
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html"
  
  - id: "S-12"
    question: "日志是否脱敏？"
    severity: "P2"
    category: "数据保护"
    check_scope: [code]
    languages: [python, java, go, js, php, ruby]
    check_points:
      - "是否记录敏感信息？"
      - "日志是否脱敏？"
      - "是否有日志访问控制？"
    fix_suggestion:
      steps:
        - "1. 定义敏感字段列表（密码、Token、身份证号等）"
        - "2. 在日志记录前进行脱敏处理"
        - "3. 使用正则表达式匹配并替换敏感信息"
      example: |
        # Python 示例
        import re
        
        def mask_sensitive(text):
            # 脱敏手机号
            text = re.sub(r'1[3-9]\d{9}', '1**********', text)
            # 脱敏身份证号
            text = re.sub(r'\d{17}[\dXx]', '******************', text)
            return text
        
        logger.info(mask_sensitive(f"User {user.phone} logged in"))
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"

  # ==================== 依赖安全 ====================
  - id: "S-13"
    question: "依赖是否安全？"
    severity: "P1"
    category: "依赖安全"
    check_scope: [config]
    languages: [python, java, go, js, php, ruby]
    check_points:
      - "是否有已知漏洞的依赖？"
      - "是否定期更新依赖？"
      - "是否使用依赖扫描工具？"
    fix_suggestion:
      steps:
        - "1. 使用依赖扫描工具检查漏洞"
        - "2. 定期更新依赖"
        - "3. 配置自动安全更新"
      example: |
        # Python
        pip install safety
        safety check
        
        # Node.js
        npm audit
        npm audit fix
        
        # GitHub Dependabot
        # 在 .github/dependabot.yml 中配置
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html"
  
  - id: "S-14"
    question: "是否有安全头？"
    severity: "P2"
    category: "配置安全"
    check_scope: [config]
    languages: [all]
    check_points:
      - "是否有 X-Content-Type-Options？"
      - "是否有 X-Frame-Options？"
      - "是否有 Content-Security-Policy？"
      - "是否有 Strict-Transport-Security？"
    fix_suggestion:
      steps:
        - "1. 配置 X-Content-Type-Options: nosniff"
        - "2. 配置 X-Frame-Options: DENY"
        - "3. 配置 Content-Security-Policy"
        - "4. 配置 Strict-Transport-Security"
      example: |
        # Nginx 示例
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Strict_Transport_Security_Cheat_Sheet.html"
