api_base: https://api.deepseek.com
api_key: <YOUR_DEEPSEEK_API_KEY>
iterations: 1
language: cn
# P54：max_tokens 从 80000 下调到 32768——推理模型思维链计入预算，
# 80000 会拖长单条推理导致超时（reasoning-model-pitfall）；4096 又太小会硬截断。
# 实际值由 run_heavyskill.py 从本文件加载（旧版从未加载，一直用 CLI 默认 4096）。
max_tokens: 32768
# P54：审议独立预算（旧版无此配置项，审议复用 4096 导致最终结论被截断）
summary_max_tokens: 16384
model: deepseek-v4-pro
output_dir: /tmp/heavyskill_output
prompt_type: general
reason_k: 8
save_trajectories: false
summary_k: 4
summary_model: deepseek-v4-pro
summary_temperature: 0.3
temperature: 0.7
timeout: 300
top_p: 0.95
# ---- P54-增强（双模型 deepseek+mimo，参考 references/enhancement-plan-dual-model.md）----
# 路径3：轨迹质量分参与选择 + 动态 K（CLI --auto-k 开启）
quality_enabled: true
auto_k: false
auto_k_scale: {short: 2, medium: 4, long: 8}
quality_retry_threshold: 60.0
# 路径1+2：结论验证器 / 异质二审（mimo；CLI --enable-validator / --enable-second-review 开启；
# key 用 --validator-api-key 传入或改此值，勿提交真实密钥）
enable_validator: false
enable_second_review: false
validator_model: mimo-v2.5-pro
validator_api_base: https://token-plan-cn.xiaomimimo.com/v1
validator_api_key: <XIAOMI_TOKEN_PLAN_CN_API_KEY>
validator_fail_on_p0: true
