[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "heavyskill"
version = "1.0.0"
description = "HeavySkill: Two-Stage Pipeline for Enhanced LLM Reasoning (arXiv:2605.02396)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "HeavySkill Contributors"},
]
keywords = ["llm", "reasoning", "pipeline", "deliberation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.24.0",
]

[project.scripts]
heavyskill = "heavyskill.scripts.run_heavyskill:cli_main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["heavyskill*"]

[tool.ruff.lint]
# P54 复审基线化（2026-08-21，HGF 裁决 FAIL 后 R6）：
# heavyskill 为 hermes 导出技能代码，既有风格债（legacy typing List/Dict/Optional、
# 导入排序、未用导入、上下文管理器注解等）按文件基线化，让 ruff 门禁恢复
# "新代码零新增"的度量意义。tests/ 不豁免——新测试必须保持干净。
# 规则：新代码请用现代风格（内置泛型 list/dict、X | None、移除未用导入）。

[tool.ruff.lint.per-file-ignores]
"configuration.py" = ["UP006", "UP045", "UP035", "F401", "I001", "F541"]
"agent/*.py" = ["UP006", "UP045", "UP035", "F401", "I001", "F541", "E722", "BLE001", "RUF059", "PYI034", "PYI036"]
"workflow/*.py" = ["UP006", "UP045", "UP035", "F401", "I001", "F541", "PYI034", "PYI036", "ASYNC230", "RUF022"]
"scripts/*.py" = ["UP006", "UP045", "UP035", "F401", "I001", "F541", "RUF059", "BLE001"]
