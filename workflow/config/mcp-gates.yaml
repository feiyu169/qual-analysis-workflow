# 门禁配置文件 - V3.4.1（版本号与 workflow/__init__.py 一致）
# .mcp-gates.yaml
#
# V3.1 变更：
# - 每个门禁声明 verification（L1-L5），执行器校验插件能力必须覆盖声明级别。
# - 新增三个纪律门禁：test-quality（拒空桩）、integration-probe（集成验证）、
#   failure-log（失败记录），把 HGF 纪律变成可执行检查。
# - command 一律为模板，支持 {files} / {coverage_min} 占位符，空则用插件默认。
#
# V3.2.0 变更：
# - 离线提速：safety/semgrep 首次运行需下载数据，可加 --offline 用缓存。
#
# V3.3.2 变更：
# - 自审查 S1：failure_log 门禁自身失败不再写入 failures.jsonl（防自锁雪崩）；
#   `--failures --archive` 归档不完整历史记录。
# - 自审查 S2：baseline.json 损坏时容错降级（canary 自动重建基线）。

gates:
  # MUST_PASS: 失败即阻断
  must_pass:
    - name: "static_analysis"
      tool: "ruff"
      command: "ruff check {files}"
      verification: "L1"
      timeout: 60

    - name: "unit_test"
      tool: "pytest"
      command: "pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under={coverage_min}"
      verification: "L1"
      # V3.3.2（自审查验收发现）：HGF 对自身跑全量 195 测试 + 覆盖率统计
      # 实测 ~270s，含 -v 详细输出与 cov 计算可能超 300s → 提升到 600s。
      #（历史上门禁只跑小 demo 项目测试集，300s 足够；自身全量需更大余量）
      timeout: 600
      # qual 大代码库总覆盖率现状 ~21%（大量 legacy 模块未测，阶段 B/C 逐步补测后上调）。
      # 20% 是"测试集真实运行"下限（防空转/缩水）；变更文件由增量门槛兜底（见下）。
      coverage_min: 20
      # 增量覆盖率门槛：只统计 git 变更文件的覆盖率，
      # 总覆盖率不达标但变更文件达标时可豁免（P33）。
      incremental_coverage_min: 80

    - name: "secret_scan"
      tool: "detect-secrets"
      command: "detect-secrets scan {files}"
      verification: "L1"
      timeout: 60

    - name: "test_quality"
      tool: "test-quality"
      command: ""
      verification: "L1"
      timeout: 60

    - name: "failure_log"
      tool: "failure-log"
      command: ""
      verification: "L1"
      timeout: 60

  # SHOULD_PASS: 失败警告
  should_pass:
    - name: "security_scan"
      tool: "semgrep"
      # 首次运行会下载 p/r2c-ci 规则集；已有缓存后可改 `semgrep --offline ...` 提速
      command: "semgrep --config=p/r2c-ci --json {files}"
      verification: "L1"
      timeout: 120

    - name: "dependency_scan"
      tool: "safety"
      # V3.3.2（自审查 M4 校准）：本机实测 **SAFETY_API_KEY 未设置**（config/.env
      # 无此键）+ safety 在线扫描网络受限（12s 无响应）→ 保持 SHOULD_PASS 是
      # 正确降级，非放松标准。注意：
      # ① 在线扫描在部分网络下极慢/可能被限流（>5min），建议作为低频深度检查
      #    手动触发（safety check --json），不放进每次常规门禁；
      # ② 有缓存库后可改 `safety check --json --offline` 提速；
      # ③ 系统 Python 实测存在大量已知漏洞（flask/flask-cors/ecdsa/cryptography/
      #    pillow/werkzeug/urllib3 等）——清单见 output/security-remediation.md
      #    （用户决策：暂不修补 51 个系统级漏洞）。
      # 恢复 must_pass 的条件：设置 SAFETY_API_KEY（config/.env）且 safety 能
      # 在时限内产出 JSON。
      command: "safety check --json"
      verification: "L1"
      # SHOULD_PASS：慢/受限环境下超时只记录不重试；时限 300s
      timeout: 300

    - name: "integration_probe"
      tool: "integration-probe"
      command: ""
      verification: "L2"
      timeout: 60
      # 集成探针：验证"已声明接入"的符号确有调用点（文件存在 ≠ 已接入）。
      # probes:
      #   - name: "折扣计算已接入测试"
      #     module: "calc"
      #     symbol: "apply_discount"
      #     usage_pattern: "apply_discount"

  # OPTIONAL: 失败记录
  optional:
    - name: "performance_test"
      tool: "pytest"
      command: "pytest tests/performance/ -v"
      verification: "L1"
      timeout: 600

    - name: "iac_scan"
      tool: "checkov"
      command: "checkov -d . --output json"
      verification: "L1"
      timeout: 300

    - name: "format_check"
      tool: "format-check"
      command: "ruff format --check {files}"
      verification: "L1"
      timeout: 120

    - name: "docs_check"
      tool: "docs-check"
      command: ""
      verification: "L1"
      timeout: 60
      # 必需章节（可选）：README.md 必须包含这些关键字
      # probes:
      #   - { name: "安装" }
      #   - { name: "使用" }

    - name: "pin_check"
      tool: "pin-check"
      command: ""
      verification: "L1"
      timeout: 60

# 按任务等级的门禁配置
level_gates:
  L0:
    must_pass: ["secret_scan"]
    should_pass: []
    optional: []

  # V3.4-B 轻量等级（heavyskill 审查修正）：成本与变更匹配
  L0_LITE:
    must_pass: ["secret_scan"]
    should_pass: []
    optional: []
    # 纯文档/配置小改（<50 行）——仅密钥扫描，<10s

  L1_LITE:
    must_pass: ["static_analysis", "secret_scan"]
    should_pass: ["format_check"]
    optional: []
    # 单文件小改（<100 行）——静态+密钥+格式（秒级），<60s（无全量 pytest）
    # V3.4 ROI 提升⑤：format_check 进 L1_LITE——实测 0.19s 拦格式问题，
    # 成本可忽略（L2 为拦它多花 2000s，ROI 极差；轻量级含它则秒级拦截）

  L1:
    must_pass: ["static_analysis", "unit_test", "secret_scan", "test_quality", "failure_log"]
    should_pass: ["security_scan", "integration_probe", "pin_check"]
    optional: []
    # V3.4 ROI 提升②：pin_check 从 OPTIONAL 提升到 L1 SHOULD_PASS——
    # 依赖未固定版本是常见缺陷（ROI 实验 unpinned-dep 实证逃逸），L1 即应拦截
    #（pin-check 查 requirements.txt；无该文件时插件跳过，对无依赖项目无害）

  L2:
    must_pass: ["static_analysis", "unit_test", "secret_scan", "security_scan", "test_quality", "failure_log"]
    should_pass: ["dependency_scan", "integration_probe"]
    optional: ["format_check"]

  L3:
    must_pass: ["static_analysis", "unit_test", "secret_scan", "security_scan", "test_quality", "failure_log"]
    should_pass: ["integration_probe", "dependency_scan"]
    optional: ["performance_test", "iac_scan", "format_check", "docs_check", "pin_check"]
    # 注：dependency_scan（safety）在无 API key/受限网络环境下无法产出 JSON
    #（fail-loud 会判 ERROR），故在 L3 降为 SHOULD_PASS——这是环境限制的记录，
    # 不是放松标准；具备 SAFETY_API_KEY 的环境应将其移回 must_pass。

  L3_LITE:
    must_pass: ["static_analysis", "secret_scan", "security_scan", "test_quality", "failure_log"]
    should_pass: ["unit_test", "integration_probe"]
    optional: []

  IAC:
    must_pass: ["secret_scan", "iac_scan"]
    should_pass: []
    optional: []

  CONFIG:
    must_pass: ["secret_scan"]
    should_pass: []
    optional: []

  DOCS:
    must_pass: ["secret_scan"]
    should_pass: []
    optional: []

# 项目级配置覆盖
project_overrides:
